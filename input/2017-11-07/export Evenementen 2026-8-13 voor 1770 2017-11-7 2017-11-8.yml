              start_time: 4021
        report: "De fracties dienen de volgende moties en amendementen in:<br /> VVD dient, mede namens Lokaal Liberaal, motie 5 (vlaggen in de raadzaal) in, met als<br /> dictum:<br /> - stappen te ondernemen die ertoe leiden dat ook in de raadzaal van Stichtse Vecht onze<br /> vlaggen zichtbaar worden;<br /> - het hiervoor benodigde bedrag binnen de begroting te vinden.<br /> CDA dient, mede namens Het Vechtse Verbond, motie 2 (Gehandicaptenparkeerplaats<br /> vergoeden uit WMO) in, met als dictum:<br /> „h De kosten voor het realiseren van een gehandicaptenparkeerplaats op een aanwezige<br /> parkeerplaats in de openbare ruimte te vergoeden vanuit de WMO.<br /> Lokaal Liberaal dient, mede namens de ChristenUnie-SGP, Het Vechtse Verbond, PvdA en<br /> Streekbelangen, motie 3 (tekstuele verslagen van raads- en commissievergaderingen) in,<br /> met als dictum:<br /> Geeft de griffier de opdracht:<br /> „h de komende maanden een pilot te doen met het geautomatiseerd opleveren van<br /> tekstuele verslagen van raads- en commissievergaderingen;<br /> „h daarbij meerdere leveranciers de mogelijkheid te bieden zicht te bewijzen;<br /> „h voor de behandeling van de Voorjaarsnota 2018 deze pilot te evalueren en advies uit te<br /> brengen aan de raad.<br /> Lokaal Liberaal dient, mede namens de ChristenUnie-SGP, Het Vechtse Verbond, PvdA en<br /> Streekbelangen, amendement 2 (tekstuele verslagen van raads- en<br /> commissievergaderingen) in, met als dictum:<br /> „h in 2018 incidenteel een bedrag van £á 30.000 beschikbaar te stellen voor de pilot<br /> tekstuele verslagen van raads- en commissievergaderingen;<br /> „h de kosten laste van de post Onvoorzien te brengen.<br /> Lokaal Liberaal dient, mede namens Stichtse Vecht Beweegt, motie 6 (voorlopig stopzetten<br /> uitrol omgekeerd inzamelen) in, met als dictum:<br /> „h in gesprek te treden met AVU en AVR om de mogelijkheden van nascheiding van<br /> plastic te bespreken;<br /> „h hierover verslag te doen aan de raad, waarin tenminste uiteengezet wordt wat de voors<br /> en tegens van nascheiding ten opzichte van bronscheiding zijn, alsmede een<br /> kostenoverzicht;<br /> „h totdat dit verslag is besproken met de raad, de uitrol van omgekeerd inzamelen stil te<br /> leggen en verder te gaan op de huidige voet, te weten:<br /> o inzameling van PMD via de plastic zakken in de daartoe geplaatste (ondergrondse)<br /> verzamelcontainers;<br /> o inzameling van papier via de papierkliko¡¦s;<br /> o inzameling van GFT via de GFT kliko¡¦s;<br /> o inzameling van restafval via de restafvalkliko¡¦s.<br /> Pagina 3 van 6<br /> Streekbelangen dient, mede namens Lokaal Liberaal, PvdA en Het Vechtse Verbond,<br /> amendement 1 (verlaging tarieven binnensport) in, met als dictum:<br /> „h besluitpunt 4 van het raadsvoorstel als volgt te wijzigen : ¡§Vaststellen van het opnemen<br /> van extra middelen voor het verlagen van de tarieven voor binnensport voor een bedrag<br /> van £á 75.000¡¨;<br /> „h het College op te dragen na advies van de Sportraad voor de Raad van 19 december<br /> 2017 met een voorstel te komen om de tarieven voor de binnensport, in plaats van<br /> deze extra te verhogen, te verlagen vanaf 1 januari 2018.<br /> GroenLinks dient, mede namens Het Vechtse Verbond en Stichtse Vecht Beweegt, motie 1<br /> (oplaadpunten voor elektrische auto¡¦s en fietsen) in, met als dictum:<br /> 1. een onderzoek te doen in alle kernen van Stichtse Vecht naar de behoefte van<br /> oplaadpunten voor elektrische auto's en fietsen in de komende jaren in overleg met<br /> wijkcommissies en dorpsraden;<br /> 2. om voor de voorjaarsnota in 2018 te komen met een voorstel dat er voor zorgt dat er<br /> voldoende elektrische oplaadpunten voor auto¡¦s en elektrische fietsen zijn in de<br /> gemeente Stichtse Vecht;<br /> 3. de daarvoor benodigde beleidsregels op te stellen;<br /> 4. ruimte te bieden aan experimenten indien dat nodig is;<br /> 5. zo spoedig mogelijk daarna de raad een voorstel te doen voor een Green Deal met het<br /> Rijk, om vervolgens een aanvraag te kunnen doen voor een rijksbijdrage voor de<br /> laadinfrastructuur voor elektrische auto¡¦s;<br /> 6. de raad op regelmatige tijden te informeren over de voortgang van het plaatsen van<br /> oplaadpunten.<br /> GroenLinks dient, mede namens PvdA, CDA en Het Vechtse Verbond, motie 4 (Zuilense<br /> Ring) in, met als dictum:<br /> 1. ten spoedigste over te gaan tot het adequaat (laten) meten van de feitelijke<br /> geluidsniveaus en concentraties luchtverontreiniging langs de Zuilense Ring zodanig<br /> dat een representatief beeld wordt verkregen;<br /> 2. samen met de provincie Utrecht en/of het Rijk tot afspraken te komen over te nemen<br /> maatregelen voor verbetering leefkwaliteit door de reductie van geluidshinder en de<br /> verbetering van de luchtkwaliteit ten opzichte van de situatie in 2017;<br /> 3. aan de provincie een dringende oproep te doen om de maximum snelheid op de<br /> Zuilense Ring terug te brengen naar 80 km per uur (zoals deze snelheid ook zal gaan<br /> gelden op de opgewaardeerde NRU);<br /> 4. te bevorderen dat de trajectcontrole op de gehele Zuilense Ring eerder wordt ingesteld<br /> dan thans is voorzien (2019) , te weten met ingang van 2018."
        indexation:
          start_offset: 418
          end_offset: 4029
