      title_prefix: '5.'
      attributes:
        -
          id: 1
          reference_model: null
          value: '20:20 uur Programmabegroting 2018'
        -
          id: 3
          reference_model: null
          value: '<p>In de programmabegroting presenteert het college de plannen voor 2018 en het meerjarenperspectief tot en met 2021. In deze meerjarenbegroting zijn de volgende punten uitgewerkt:</p><p>a. de Voorjaarsnota 2017;</p><p>b. de vernieuwing van de voorschriften van het Besluit Begroting en verantwoording (BBV);</p><p>c. de meicirculaire Gemeentefonds 2017.</p><p>De programmabegroting is besproken in de commissie Bestuur en Financien van 24 oktober 2017. De commissie heeft ingestemd met behandeling als bespreekstuk.</p><p>De programmabegroting is gewijzigd n.a.v. de commissievergadering (wijzigingen zijn geel gearceerd) en er zijn antwoorden gegeven op vragen die tijdens de commissievergadering zijn gesteld.</p>'
    module_items: {  }
    id: 3683112
    type: agenda_point
