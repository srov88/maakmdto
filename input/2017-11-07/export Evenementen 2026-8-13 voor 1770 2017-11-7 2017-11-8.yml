        report: 'D66 zal de aangepaste motie 1 mede ondertekenen.<br /> CDA geeft aan dat in de titel van motie 2 en in het dictum het woord “vergoeden” is<br /> gewijzigd in “dekken”.<br /> GroenLinks meldt dat motie 1 is gewijzigd:<br /> De punten 2, 3, 4 en 5 zijn vervallen. Punt 6 is vernummerd naar punt 2.<br /> Motie 4 is ook gewijzigd in:<br /> 1. in nauwe samenwerking met OdrU en de “Buren van de Zuilense Ring” een meetplan<br /> op te stellen voor het adequaat (laten) meten van de feitelijke geluidsniveaus en<br /> concentraties luchtverontreiniging langs de Zuilense Ring zodanig dat een<br /> representatief beeld wordt verkregen;<br /> 2. met de provincie tot overeenstemming te komen om maatregelen te nemen voor<br /> verbetering leefkwaliteit door de reductie van geluidshinder en de verbetering van de<br /> luchtkwaliteit ten opzichte van de situatie in 2017;<br /> Punt 3 is ongewijzigd en punt 4 is vervallen.<br /> Lokaal Liberaal houdt motie 6 aan. Eerst agenderen voor commissievergadering.<br /> Pagina 5 van 6<br /> Streekbelangen wijzigt, mede namens Lokaal Liberaal, PvdA en Het Vechtse Verbond, het<br /> dictum van amendement 1.<br /> Bij de 1e bullit vervallen de woorden: “het verlagen van de tarieven voor” en bij de 2e bullit<br /> vervallen de woorden: “om de tarieven”.<br /> ChristenUnie-SGP zal in de schorsing in overleg met de voorzitter de tekst van motie 3<br /> wijzigen.<br /> Streekbelangen dient amendement 3 in, met als dictum: Voegt aan de Inleiding van de<br /> Programmabegroting bij de opsomming van Topdossiers “Zuilense Vecht” toe.'
        indexation:
          start_offset: 7929
          end_offset: 11217
