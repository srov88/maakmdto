        report: 'Wethouder Balemans meldt dat in de septembercirculaire een meevaller van . 60.000,-- zit.<br /> Dit bedrag kan als dekking worden gebruikt voor wensen uit de raad zoals het bedrag van<br /> . 30.000,-- voor de notulen van raads- en commissievergaderingen. Het debat over de<br /> septembercirculaire moet nog plaatsvinden in de commissie Bestuur en Financien van 28<br /> november en de raad van 19 december 2017.<br /> Voor het maken van verbeterslagen in de 2e lijns communicatie is opdracht gegeven. Zodra<br /> hier meer inzicht in is zal de raad worden geinformeerd.<br /> Over het verbeterplan voor het groenonderhoud en het debat over de BSWW heeft hij al<br /> eerder toezeggingen gedaan.<br /> Toezegging wethouder Balemans:<br /> Zodra meer duidelijkheid te geven is over de 2e lijns communicatie de raad hierover<br /> informeren.<br /> Pagina 4 van 6<br /> Wethouder Pieter de Groene antwoordt dat in 2018 gestart wordt met de Cultuurnota. Wat<br /> de NRU betreft neemt Stichtse Vecht deel aan de bestuurlijke stuurgroep Ring Utrecht. De<br /> notulen van deze bijeenkomsten zijn door de raad in te zien.<br /> Op verzoek van Lokaal Liberaal zal hij het document van enige jaren terug over de<br /> berekeningen van gemaakte kosten voor voorzieningen ligplaatsen versus opbrengsten<br /> kadegelden naar de raad sturen.<br /> Motie 1 Overbodig<br /> Motie 4 Stelt tekstwijzigingen voor; bij een goede intonatie, staat het college achter<br /> de inhoud. Voor twee meetpunten is geld in de begroting opgenomen. De<br /> trajectcontrole is een Rijksaangelegenheid.<br /> Toezegging wethouder De Groene:<br /> het document van enige jaren terug over de berekeningen van gemaakte kosten voor<br /> voorzieningen ligplaatsen versus opbrengsten kadegelden naar de raad sturen.<br /> Wethouder Van Vossen reageert op amendement 1. Hij komt met een integraal voorstel om<br /> de tarieven voor de sport in zijn geheel nog eens goed te bekijken. Zowel voor binnen- als<br /> voor buitensport, trapveldjes, etc.<br /> Wethouder .ivkovi.-Laurenta antwoord dat het dossier gZuilense Vechth zeker een<br /> topdossier is. Hij komt binnenkort met een voorstel.<br /> De voorzitter voegt hier aan toe dat indien het dossier gZuilense Vechth aan het rijtje van<br /> topdossiers moet worden toegevoegd, hier een amendement voor moet worden ingediend.<br /> Wethouder Koops neemt motie 2 over. Met betrekking tot de zorgmijders komt zij<br /> binnenkort met informatie over het onderzoek in een RIB.<br /> Wethouder Van Dordt ontraadt motie 6.'
