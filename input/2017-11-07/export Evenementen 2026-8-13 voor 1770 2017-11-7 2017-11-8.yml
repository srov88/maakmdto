        report: '<p>Stemverklaringen:<br />VVD is tegen amendement 1, vanwege de wijze van dekking.<br />Stichtse Vecht Beweegt is tegen amendement 1. Wil eerst een harmonisatieslag maken.<br />D66 en CDA zijn voor motie 3 vanwege de beschikbaarheid voor doven en slechthorenden.<br />Streekbelangen, Maarssen 2000 en PvdA zijn tegen motie 1, in verband met de door het<br />college voorgestelde dekking.<br />Vervolgens geeft GroenLinks aan de motie aan te houden.<br />Amendement 1 is aangenomen met 16 stemmen v&oacute;&oacute;r en 15 stemmen tegen. (V&oacute;&oacute;r: de<br />fracties van CDA, Lokaal Liberaal, Streekbelangen, Maarssen 2000, PvdA en Het Vechtse<br />Verbond. Overige fracties tegen.)<br />Amendement 3 is unaniem aangenomen.<br />Motie 2 is aangenomen met 29 stemmen v&oacute;&oacute;r en 2 stemmen tegen. (Tegen de fractie van<br />GroenLinks. Overige fracties v&oacute;&oacute;r.)<br />Motie 3 is aangenomen met 28 stemmen v&oacute;&oacute;r en 3 stemmen tegen. (Tegen de fracties van<br />GroenLinks en Stichtse Vecht Beweegt. Overige fracties v&oacute;&oacute;r.)<br />Motie 4 is aangenomen met 30 stemmen v&oacute;&oacute;r en 1 stem tegen. (Tegen de fractie Stichtse<br />Vecht Beweegt. Overige fracties v&oacute;&oacute;r.)<br />Pagina 6 van 6<br />Motie 5 is verworpen met 13 stemmen v&oacute;&oacute;r en 18 stemmen tegen. (V&oacute;&oacute;r de fracties van de<br />VVD, twee leden van het CDA, t.w. Klaas Overbeek en Dinno de Meer, Lokaal Liberaal, 1<br />lid van Streekbelangen, t.w. Renie Vis, 1 lid van de PvdA, t.w. Maarten van Dijk en Het<br />Vechtse Verbond. Tegen de fractie van D66, twee leden van het CDA, t.w. Siem<br />Scherpenzeel en Hetty Veneklaas, 1 lid van Streekbelangen, t.w. Vital van der Horst,<br />Maarssen 2000, ChristenUnie-SGP, 1 lid van de PvdA, t.w. Els Swerts, GroenLinks en<br />Stichtse Vecht Beweegt.)</p>'
